<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hatta Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 180px;
      background: #e5e7eb;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      color: #6b7280;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #374151;
    }

    footer {
      margin-top: 40px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Hatta Store</h1>
    <p>متجرك الإلكتروني</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>منتجاتنا</h2>
      <p>اكتشف منتجاتنا واختر ما يناسبك</p>
    </section>

    <section class="products">

      <div class="product">
        <div class="product-image">
          صورة المنتج
        </div>

        <h3>منتج رقم 1</h3>

        <p>وصف قصير للمنتج</p>

        <div class="price">
          2500 دج
        </div>

        <button>أضف إلى السلة</button>
      </div>

      <div class="product">
        <div class="product-image">
          صورة المنتج
        </div>

        <h3>منتج رقم 2</h3>

        <p>وصف قصير للمنتج</p>

        <div class="price">
          3500 دج
        </div>

        <button>أضف إلى السلة</button>
      </div>

      <div class="product">
        <div class="product-image">
          صورة المنتج
        </div>

        <h3>منتج رقم 3</h3>

        <p>وصف قصير للمنتج</p>

        <div class="price">
          4500 دج
        </div>

        <button>أضف إلى السلة</button>
      </div>

    </section>

  </main>

  <footer>
    © 2026 Hatta Store - جميع الحقوق محفوظة
  </footer>

</body>
</html>
